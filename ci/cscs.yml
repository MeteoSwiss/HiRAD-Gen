include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

stages:
  - build
  - test

variables:
  PERSIST_IMAGE_NAME: $CSCS_REGISTRY_PATH/hirad-gen:$CI_COMMIT_SHORT_SHA

build_job:
  stage: build
  extends: .container-builder-cscs-gh200
  variables:
    DOCKERFILE: ci/docker/Dockerfile.ci
    KUBERNETES_MEMORY_REQUEST: '64Gi'
    KUBERNETES_MEMORY_LIMIT: '64Gi'

test_job:
  stage: test
  extends: .container-runner-clariden-gh200
  image: $PERSIST_IMAGE_NAME
  script:
    # - echo 'hello world'
    - pytest sourcecode/tests/ -v
  variables:
    USE_MPI: NO
    SLURM_MPI_TYPE: pmix
    SLURM_NETWORK: disable_rdzv_get
    PMIX_MCA_psec: native
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 1
