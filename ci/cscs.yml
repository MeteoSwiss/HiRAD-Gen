include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

stages:
  - build
  - test

variables:
  PERSIST_IMAGE_NAME: $CSCS_REGISTRY_PATH/hirad-gen:$CI_COMMIT_SHORT_SHA

build_job:
  stage: build
  extends: .container-builder-cscs-gh200
  variables:
    DOCKERFILE: ci/docker/Dockerfile.ci

test_job:
  stage: test
  extends: .container-runner-clariden-gh200
  image: $PERSIST_IMAGE_NAME
  script:
     - echo 'hello world'
  #  - pip install -e . --no-dependencies
  #  - python src/hirad/training/train.py --config-name=training_era_cosmo_regression_test.yaml
  variables:
    SLURM_JOB_NUM_NODES: 2
    SLURM_NTASKS: 2
    #SLURM_ACCOUNT: a161
    #SBATCH_ACCOUNT: a161
