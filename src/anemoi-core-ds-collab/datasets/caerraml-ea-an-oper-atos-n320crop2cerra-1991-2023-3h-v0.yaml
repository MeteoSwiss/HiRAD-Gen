#yaml
name: caerraml-ea-an-oper-atos-n320crop2cerra-1991-2023-3h-v0

description: |
  This recipe subsamples the 1h full-resolution ERA5 dataset to 3h and crops it to the CERRA region + 100km buffer, for the purposes of downscaling.

dates:
  end: '2023-12-31T23:59:00'
  frequency: 3h
  start: '1983-01-01T00:00:00'

input:
    pipe: #default era5 variables and crops
        - anemoi-dataset:
                dataset: /capstor/store/cscs/pasc/c38/anemoi-datasets/aifs-ea-an-oper-0001-mars-n320-1979-2023-1h-v1-with-ERA51.zarr
                select: # all era5 variables you are interested in
                    - 10u
                    - 10v
                    - 2t
                    - sp
                    # Constants / forcings
                    - sin_julian_day
                    - sin_latitude
                    - sin_local_time
                    - sin_longitude
                    - cos_julian_day
                    - cos_latitude
                    - cos_local_time
                    - cos_longitude
                    - insolation
        - regrid:
            mask: /capstor/store/cscs/pasc/c38/anemoi-downscaling-data/era2cerra_mask_100km.npz