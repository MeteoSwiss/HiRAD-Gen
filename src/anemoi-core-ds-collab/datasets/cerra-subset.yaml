#yaml
name: cerra-rr-an-oper-se-al-ec-mars-5p5km-2020-2023-3h-v2

description: |
  This recipe takes crops the cerra dataset for transfer.

dates:
  start: '2020-01-01T00:00:00'
  frequency: 3h
  end: '2023-12-31T18:00:00'
  group_by: daily

input:
    pipe: #default era5 variables and crops
        - anemoi-dataset:
                dataset: /home/mlx/ai-ml/datasets/cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr
                select: # all cerra variables you are interested in
                    - 10u
                    - 10v
                    - 2t
                    - t_850
                    - tcw
                    - tp
                    - u_850
                    - v_850
                    - z_850
                    - t_500
                    - u_500
                    - v_500
                    - z_500                    
                    # Constants / forcings
                    - sin_julian_day
                    - sin_latitude
                    - sin_local_time
                    - sin_longitude
                    - cos_julian_day
                    - cos_latitude
                    - cos_local_time
                    - cos_longitude
                    - insolation
                    - lsm
                    - z