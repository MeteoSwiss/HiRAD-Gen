defaults:
- data: multi
- dataloader: multi
- diagnostics: evaluation_multi # changed because no_plots doesn't work
- system: example
- graph: multi_scale
- model: graphtransformer
- training: downscaling
- _self_

config_validation: True

data:
  resolution: n320
  datasets:
    era5:  # low-res dataset: all variables should be forcing variables
      diagnostic: []
      # Use a subset of forcing variables for debugging
      forcing: ['2t', '10u', '10v', 'tcw', 't_850', 'z_850', 'u_850', 'v_850', 't_500', 'z_500', 'u_500', 'v_500', 'tp']
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            std: null
    cerra:  # high-res dataset: all variables should be diagnostic or forcing variables
      # Any forcing variables can be added here: orog, lsm, time features, etc.
      forcing: []
      # Only a subset of CERRA variables is used here for debugging purposes
      diagnostic: [tp, 2t, 10si, 10wdir, z_100, z_500, z_850, z_1000, t_500, u_100, v_100, u_500, v_500, u_850, v_850]
      processors:
        normalizer:
          config:
            none: null
    cosmo:
      forcing: # static variables we use
      - "hsurf"
      diagnostic: [2t, 10u, 10v, tp]
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: "mean-std"
            std:
            - "tp"
            min-max:
            max:
            none:
            - "cos_latitude"
            - "cos_longitude"
            - "sin_latitude"
            - "sin_longitude"
            - "cos_julian_day"
            - "cos_local_time"
            - "sin_julian_day"
            - "sin_local_time"
        const_imputer:
          _target_: anemoi.models.preprocessing.imputer.InputImputer
          config:
            default: "mean"

system:
  input:
    graph: graph_anemoi_new_${data.resolution}.pt
    truncation: null

    # Primary dataset for ERA5
    dataset: aifs-ea-an-oper-0001-mars-n320-1979-2024-1h-v2-with-era51.zarr

    # Secondary dataset for COSMO
    dataset_b: mch-co2-an-archive-0p02-2015-2020-1h-v3-pl13.zarr

  output:
    root: ${oc.env:SCRATCH}/anemoi-test/${data.resolution}/


dataloader:
  training:
    datasets:
      era5: # low-res dataset: all variables should be forcing variables
        dataset:
          dataset: ${system.input.dataset}
          select: ${data.datasets.era5.forcing}
      cerra: # high-res dataset: all variables should be diagnostic or forcing variables
        dataset:
          dataset: ${system.input.dataset_b}
          select: ${data.datasets.cerra.diagnostic}
  validation:
    datasets:
      era5: # low-res dataset: all variables should be forcing variables
        dataset:
          dataset: ${system.input.dataset}
          select: ${data.datasets.era5.forcing}
      cerra: # high-res dataset: all variables should be diagnostic or forcing variables
        dataset:
          dataset: ${system.input.dataset_b}
          select: ${data.datasets.cerra.diagnostic}

diagnostics:
  plot: simple
    #callbacks: []
  log:
    mlflow:
      enabled: False
      tracking_uri: None
    wandb:
      enabled: False
      entity: example
