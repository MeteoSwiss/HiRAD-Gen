# 6h-input variant: the ERA input dataset is 6-hourly and is paired with the hourly real
# target at matching valid times (00/06/12/18). tp Box-Cox(0.25) stats were recomputed for
# the 6h input and the TOT_PREC_6H target over the training range 2005-2020.
# Select with `dataset=anemoi_era_real_6h` (or set it in the training config defaults).
type: anemoi_era5_real
# input_anemoi_dataset_path: '/capstor/store/cscs/swissai/weatherbench/aifs-ea-an-oper-0001-mars-n320-1979-2023-1h-v1-with-ERA51.zarr'
# input_anemoi_dataset_path: '/capstor/store/mch/msopr/ml/datasets/aifs-ea-an-oper-0001-mars-n320-1979-2024-1h-v2-with-era51.zarr'
input_anemoi_dataset_path: '/capstor/store/mch/msopr/ml/datasets/aifs-ea-an-oper-0001-mars-n320-1979-2024-6h-v1-for-single-v2.zarr'
# corrected_tp_path: '/capstor/scratch/cscs/mmcgloho/basic-numpy/copernicus-era-1h/copernicus-interpolated/'
target_anemoi_dataset_path: '/capstor/store/mch/msopr/ml/datasets/mch-realch1-fdb-1km-2005-2025-1h-pl13-v1.0.zarr'
# The 6h target precip variable (TOT_PREC_6H) is selected automatically because the input
# frequency is detected as 6h. Set input_frequency to resample a finer input instead.
# input_frequency: '6h'
input_channel_names: [2t, 10u, 10v, tcw, t_850, z_850, u_850, v_850, t_500, z_500, u_500, v_500, tp]
output_channel_names: [2t, 10u, 10v, tp]
static_channel_names: ['FIS']
transform_channels: ['tp-box_cox_025']
transform_input_means: {'tp-box_cox_025': -3.6759370671419296}
transform_input_stdevs: {'tp-box_cox_025': 0.3549699264082265}
transform_output_means: {'tp-box_cox_025': -3.8122792453976}
transform_output_stdevs: {'tp-box_cox_025': 0.3346287581617763}
n_month_hour_channels: 4
start_date: '2005-01-02'
end_date: '2020-12-31'
trim_edge: 41
validation: True
validation_start_date: '2021-01-01'
validation_end_date: '2021-12-31'
