# IFS-HRES (~9-11km forecast) -> RealCH1 training dataset, with per-sample lead-time labels.
# type -> AnemoiForecastDataset: start/end are the first/last forecast INIT (base) times; the
# split is by init time (train/val leakage via long leads is accepted). No input_stats path,
# so the input is normalised with the IFS-HRES trajectories zarr's own (global) statistics.
type: anemoi_ifsn320_real
input_anemoi_dataset_path: '/capstor/scratch/cscs/pstamenk/ifs-hres-realch1/ifs_hres_traj_2020_202502.zarr'
target_anemoi_dataset_path: '/capstor/store/mch/msopr/ml/datasets/mch-realch1-fdb-1km-2005-2025-1h-pl13-v1.0.zarr'
input_channel_names: [2t, 10u, 10v, tcw, t_850, z_850, u_850, v_850, t_500, z_500, u_500, v_500, tp]
output_channel_names: [2t, 10u, 10v, tp]
static_channel_names: ['FIS']
transform_channels: ['tp-box_cox_025']
# tp Box-Cox(0.25) stats, both recomputed on seasonally-spread subsets over the training range
# (2020-10..2025-02) via calculate_tp_boxcox_stats.py, with STRIDE coprime to the daily cycle so
# all hours of day are sampled (avoids diurnal aliasing):
#   input  = IFS-HRES trajectories zarr tp   (stride 7,  base axis)
#   output = RealCH1 target TOT_PREC_1H       (stride 97, hourly, N=458M)
transform_input_means: {'tp-box_cox_025': -3.847969383912039}
transform_input_stdevs: {'tp-box_cox_025': 0.21939737330078693}
transform_output_means: {'tp-box_cox_025': -3.923594846877984}
transform_output_stdevs: {'tp-box_cox_025': 0.19256625704644262}
n_month_hour_channels: 4
trim_edge: 41
provide_lead_time: True
# max_lead_hours: 33   # optional: cap the lead used without rebuilding the zarr
# Split by INIT time (train/val leakage via long leads accepted). Zarr covers 2020-10..2025-02.
start_date: '2020-10-01'
end_date: '2024-06-30'
validation: True
validation_start_date: '2024-07-01'
validation_end_date: '2025-02-28'
