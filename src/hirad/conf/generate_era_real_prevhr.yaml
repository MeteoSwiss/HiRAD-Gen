# Previous-HR temporal conditioning (era_real_tc: cv1 split, diffusion trained from scratch with
# history dropout 0.25): generate_era_real with the autoregressive rollout switched on. Each
# member carries its own previous prediction; the first step of a contiguous window, and any step
# after a gap, runs with the null history.
hydra:
  job:
    name: generation_era_real_prevhr

defaults:
  - generate_era_real
  - _self_

generation:
  prev_hr_conditioning: True
  rollout: True
  io:
    # The regression is byte-identical to cv1's; set here so the pair stays together.
    res_ckpt_path: /capstor/store/cscs/pasc/c38/model_checkpoints/era_real_tc/diffusion/
    reg_ckpt_path: /capstor/store/cscs/pasc/c38/model_checkpoints/era_real_tc/regression/
