name: diffusion_transformer

# model_args:
#   depth: 16
#   hidden_size: 512
#   num_heads: 8
#   patch_size: 16

model_args:
  depth: 16
  hidden_size: 512
  num_heads: 16
  patch_size: 4
  attention_backend: natten2d

  # EDM sigma_data — shared by the preconditioner AND the DiffusionLoss weight, and
  # saved to model_args.json so inference rebuilds the same preconditioner. 0.5 is the
  # legacy value; EXP2 tests sigma_data=1.0 (the ~unit-variance normalized-target std).
  sigma_data: 0.5

  attn_kwargs:
    attn_kernel: 31
    qk_norm: True