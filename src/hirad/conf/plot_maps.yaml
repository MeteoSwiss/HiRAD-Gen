hydra:
  job:
    chdir: true
    name: plot_maps
  run:
    dir: .

# Get defaults
defaults:
  - _self_
  # Dataset
  - dataset/era_cosmo_inference

results_dir: /capstor/scratch/cscs/pstamenk/outputs/generation/test_period_advanced_stats_2

time_steps: null  # If null, will use all time steps in the results directory

output_dir: ${results_dir}/plots_boxcox_masked_limits # Directory to save the plots

plot_box_precipitation: False  # Whether to plot box precipitation maps, otherwise plot with box-cox transform
tp_threshold: 0.0002  # Threshold in m/h for masking precipitation values