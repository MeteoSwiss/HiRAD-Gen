hydra:
  job:
    chdir: true
    name: dit_prev_time_step_conditioning
  run:
    dir: /capstor/scratch/cscs/pstamenk/outputs/training/${hydra:job.name}

# Autoregressive DiT — previous-HR-frame conditioning is ON, inherited from the
# shared configs: dataset/anemoi_era_real (n_prev_hr_frames=1) and
# training/era_real_dit (prev_hr_dropout=0.2). train_dit.yaml is the plain variant.
defaults:
  - _self_

  # Dataset
  - dataset/anemoi_era_real

  # Model
  - model/era_real_dit

  # Training
  - training/era_real_dit

  # Logging
  - logging/era_real_dit