hydra:
  job:
    chdir: true
    name: diffusion_era_real
  run:
    dir: ./outputs/training/${hydra:job.name}

# CorrDiff stage 2 — residual diffusion (patched UNet). _self_ is LAST so the
# dataset override below wins: CorrDiff must NOT inherit AR-DiT's
# n_prev_hr_frames=1 from the shared dataset config (that would change the input
# channel count and break the diffusion model).
defaults:
  - dataset/anemoi_era_real
  - model/era_real_diffusion_patched
  - model_size/normal_real
  - training/era_real_diffusion_patched
  - logging/era_real_diffusion
  - _self_

dataset:
  n_prev_hr_frames: 0
