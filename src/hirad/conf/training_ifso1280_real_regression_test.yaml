# Debug-partition smoke test for the new anemoi_ifso1280_real dataset - same dataset as
# prod (that's what's being tested), mini model size for a fast run.
hydra:
  job:
    chdir: true
    name: regression_ifso1280_real_test
  run:
    dir: ./outputs/training/${hydra:job.name}

# Get defaults
defaults:
  - _self_

  # Dataset
  - dataset/anemoi_ifso1280_real

  # Model
  - model/era_real_regression

  - model_size/mini

  # Training
  # Leave same as prod
  - training/era_real_regression

  # Logging
  - logging/era_real_regression
