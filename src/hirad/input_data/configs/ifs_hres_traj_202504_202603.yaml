# Test-period build: IFS-HRES trajectories, 2025-03-31 .. 2026-03-31 (00/12Z), leads +1..+33h.
# Buffered one 12h cycle past 2025-04-01/2026-03-31 on each side so leads 1..33h fully cover
# valid times across the requested 2025-04-01..2026-03-31 window (see
# conf/dataset/anemoi_ifso1280_real_inference.yaml).
description: "IFS-HRES 2025-03-31..2026-03-31 00/12Z +1..33h"

base_dates:
  start: 2025-03-31T00:00:00
  end: 2026-03-31T12:00:00
  frequency: 12h
  missing: []

steps:
  start: 1h
  end: 33h
  frequency: 1h

input:
  ifs-hres-files:
    directory: /capstor/scratch/cscs/mmcgloho/ifs-hres-realch1/precompute_202504_202603

output:
  layout: trajectories
  dtype: float32
  chunking:
    base_dates: 1
    steps: 1
    ensembles: 1

build:
  variable_naming: "{param}_{levelist}"
  remapping:
    param_level: "{param}_{levelist}"
  use_grib_paramid: false

# Full-envelope statistics: every trajectory [base+1h, base+33h] inside the window
# (last base 2026-03-31T12 + 33h = 2026-04-01T21).
statistics:
  start: 2025-03-31T01:00:00
  end: 2026-04-01T21:00:00
