base_dates:
  start: 2024-06-01 00:00:00
  end:   2024-06-30 00:00:00
  frequency: 12h

steps:
  start: 6h
  end: 360h
  frequency: 6h

input:
  join:
    - mars:
        type: fc
        class: od
        expver: "0001"
        #grid: 0.1/0.1
        grid: o1280
        param: [t,z,u,v]
        levtype: pl
        level: [500,850]
        stream: oper
        area: 50.5/0/42/17.5
        # Force hour-based sequence alignment here
        #step: [1, 2, 3, 4, 5, 6]
    - mars:
        type: fc
        class: od
        expver: "0001"
        grid: o1280
        #grid: 0.1/0.1
        param: [2t,10u,10v,tcw]
        levtype: sfc
        stream: oper
        area: 50.5/0/42/17.5
        # Force hour-based sequence alignment here
        #step: [1, 2, 3, 4, 5, 6]

output:
  layout: trajectories
